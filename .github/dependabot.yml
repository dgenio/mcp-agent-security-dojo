# Root-only dependency automation. Intentionally vulnerable teaching scenarios
# are deliberately excluded so their known-bad dependency state remains
# reproducible and pedagogically useful.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-nonmajor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      root-python-nonmajor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      root-python-security-nonmajor:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

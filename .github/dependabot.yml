version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (pins are immutable, so Dependabot
  # raises a PR with the new SHA + version comment when an action updates).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Keep the Python dependencies (declared in pyproject.toml) current.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs on every PR and push: verify repo-relative Markdown links resolve and
  # that the MkDocs site builds. Keeps the doc-heavy repo from shipping broken
  # internal references (#79) and gates the publish step (#97).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs]
      - name: Check Markdown links
        run: make linkcheck
      - name: Build site
        run: make docs

  # Publishes the built site to the gh-pages branch on pushes to main. Pages
  # must be enabled in repo settings (Settings -> Pages -> Deploy from branch
  # -> gh-pages) for the site to serve at the configured site_url (#97).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
      - name: Deploy to GitHub Pages
        run: python -m mkdocs gh-deploy --force

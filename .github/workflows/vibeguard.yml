name: vibeguard

on:
  pull_request:

permissions:
  contents: read

jobs:
  vibeguard-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run scenario 07 safe path
        run: python scenarios/07_ai_generated_auth_bypass_pr/safe_run.py

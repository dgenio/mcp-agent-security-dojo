name: vibeguard

on:
  pull_request:

permissions:
  contents: read

jobs:
  vibeguard-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run scenario 07 safe path
        run: python scenarios/07_ai_generated_auth_bypass_pr/safe_run.py

name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      # Scans the governed controls and tooling only; the intentionally-unsafe
      # teaching modules are excluded (see SECURITY.md / Makefile BANDIT_EXCLUDE).
      - name: Bandit security scan
        run: make security

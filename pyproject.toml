[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-security-dojo"
version = "0.2.1"
description = "A hands-on security dojo for MCP-style and tool-using AI agents: reproduce common failure modes, then govern them with policy gates, bounded context, deterministic flows, capability scoping, and audit traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Diogo Santos" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "agent-security",
  "llm-security",
  "prompt-injection",
  "tool-use",
  "policy-as-code",
  "audit-trail",
  "ai-safety",
  "security-lab",
  "defense-in-depth",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Education",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/dgenio/mcp-agent-security-dojo"
Repository = "https://github.com/dgenio/mcp-agent-security-dojo"
Issues = "https://github.com/dgenio/mcp-agent-security-dojo/issues"
Documentation = "https://github.com/dgenio/mcp-agent-security-dojo/tree/main/docs"
Changelog = "https://github.com/dgenio/mcp-agent-security-dojo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dojo"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# Lenient first pass scoped to the governed library: precise annotations are
# verified without a large initial cleanup. Tighten (e.g. disallow_untyped_defs)
# in a follow-up once adapters/tests are annotated too (#77).
python_version = "3.10"
files = ["src/dojo"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
# Scope the scan to the governed controls and tooling (per SECURITY.md). The
# intentionally-vulnerable teaching surface is excluded so the scan stays
# signal-rich rather than flagging the lab's deliberate failure modes (#84).
# Directory exclusions are honoured from config; the unsafe baseline *files*
# under src/dojo are excluded via `-x` in `make security` / the CI job (bandit
# only honours file-level excludes from the CLI).
exclude_dirs = ["tests", "scenarios"]

# Pre-commit hooks mirroring the CI fast checks (ruff lint + format) plus basic
# hygiene. Install with `pre-commit install` (or `make hooks`); run across the
# tree with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # mkdocs.yml uses a `!!python/name:` tag; --unsafe checks syntax only.
        args: [--unsafe]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: ruff (lint)
      - id: ruff-format
        name: ruff (format)
